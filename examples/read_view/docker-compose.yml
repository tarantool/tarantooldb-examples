version: '3'
services:
  tarantool-router:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    ports:
      - 8081:8081
      - 3301:3301
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-router:3301

  tarantool-storage1:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    ports:
      - 8082:8081
      - 3302:3301
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage1:3301

  tarantool-storage2:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    ports:
      - 8083:8081
      - 3303:3301
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage2:3301

  tarantool-storage3:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    ports:
      - 8084:8081
      - 3304:3301
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage3:3301

  tarantool-storage4:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    ports:
      - 8085:8081
      - 3305:3301
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage4:3301

  tarantool-db-init:
    image: tarantooldb:latest
    networks:
      - tarantooldb_network
    environment:
      - TARANTOOLDB_TARGET_URI=tarantool-router:8081
    working_dir: /usr/share/tarantool/tarantooldb/client/utils/
    command: /bin/bash -c "./bootstrap.sh && ./migrate.sh"
    depends_on:
      - tarantool-router
      - tarantool-storage1
      - tarantool-storage2
      - tarantool-storage3
      - tarantool-storage4
    volumes:
      - ./bootstrap/:/bootstrap/

networks:
  tarantooldb_network:
