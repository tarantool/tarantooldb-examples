http:
    host: 0.0.0.0
    port: 8081

storage:
    provider: tarantool
    tarantool:
        prefix: /tcm
        username: client
        password: secret
        addrs:
            - tarantool-config-storage-1:3301
            - tarantool-config-storage-2:3301
            - tarantool-config-storage-3:3301
security:
  bootstrap-password: secret

cluster:
  tt-command: /app/tarantooldb/tt

initial-settings:
  clusters:
    - name: Tarantool DB Cluster
      id: 00000000-0000-0000-0000-000000000000
      storage-connection:
        provider: tarantool
        tarantool-connection:
          prefix: /tdb
          username: client
          password: secret
          endpoints:
            - tarantool-config-storage-1:3301
            - tarantool-config-storage-2:3301
            - tarantool-config-storage-3:3301
      tarantool-connection:
        username: "admin"
        password: "secret-cluster-cookie"
