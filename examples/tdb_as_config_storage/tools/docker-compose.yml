services:
  tcm-1:
    image: tarantooldb:3x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8081:8081"
    volumes:
      - ./tcm.yml:/app/tarantooldb/tcm.yml
      - ../main_cluster/config.yml:/app/tarantooldb/config.yml
    command: ./tcm -c tcm.yml

  prometheus:
    image: prom/prometheus:v2.30.3
    networks:
      - tarantooldb_network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:9.5.14
    networks:
      - tarantooldb_network
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana:/etc/grafana/provisioning

networks:
  tarantooldb_network:
    external: true
