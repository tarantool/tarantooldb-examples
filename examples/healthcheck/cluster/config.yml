credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

sharding:
  bucket_count: 30000

roles_cfg:
  roles.healthcheck:
    http:
      - endpoints:
        - path: /healthcheck
  roles.metrics-export:
    http:
    - endpoints:
      - format: prometheus
        path: /metrics
      listen: 8081

groups:
  routers:
    replication:
      failover: manual
    sharding:
      roles: [router]
    roles:
      - roles.crud-router
      - roles.metrics-export
      - roles.httpd
      - roles.healthcheck
    roles_cfg:
      roles.crud-router:
        stats: true
        stats_driver: metrics
        stats_quantiles: true
        stats_quantile_tolerated_error: 0.001
        stats_quantile_age_buckets_count: 5
        stats_quantile_max_age_time: 180
    replicasets:
      router-msk:
        leader: router-msk
        instances:
          router-msk:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-router-msk:8181
            iproto:
              listen:
                - uri: tarantool-router-msk:3301
              advertise:
                client: tarantool-router-msk:3301
      router-spb:
        leader: router-spb
        instances:
          router-spb:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-router-spb:8181
            iproto:
              listen:
                - uri: tarantool-router-spb:3301
              advertise:
                client: tarantool-router-spb:3301
  storages:
    replication:
      failover: manual
    sharding:
      roles: [storage]
    roles:
      - roles.crud-storage
      - roles.metrics-export
      - roles.httpd
      - roles.healthcheck
    replicasets:
      storage-1:
        leader: storage-1-msk
        instances:
          storage-1-msk:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-1-msk:8181
            iproto:
              listen:
                - uri: tarantool-storage-1-msk:3301
              advertise:
                client: tarantool-storage-1-msk:3301
          storage-1-spb:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-1-spb:8181
            iproto:
              listen:
                - uri: tarantool-storage-1-spb:3301
              advertise:
                client: tarantool-storage-1-spb:3301
          storage-1-brn:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-1-brn:8181
            iproto:
              listen:
                - uri: tarantool-storage-1-brn:3301
              advertise:
                client: tarantool-storage-1-brn:3301
      storage-2:
        leader: storage-2-msk
        instances:
          storage-2-msk:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-2-msk:8181
            iproto:
              listen:
                - uri: tarantool-storage-2-msk:3301
              advertise:
                client: tarantool-storage-2-msk:3301
          storage-2-spb:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-2-spb:8181
            iproto:
              listen:
                - uri: tarantool-storage-2-spb:3301
              advertise:
                client: tarantool-storage-2-spb:3301
          storage-2-brn:
            roles_cfg:
              roles.httpd:
                default:
                  listen: tarantool-storage-2-brn:8181
            iproto:
              listen:
                - uri: tarantool-storage-2-brn:3301
              advertise:
                client: tarantool-storage-2-brn:3301
