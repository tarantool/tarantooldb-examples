router-msk:
  instances:
  - router-msk
  roles:
  - failover-coordinator
  - crud-router
  - space-explorer
  - dictionary.roles.router
  all_rw: false
router-spb:
  instances:
  - router-spb
  roles:
  - failover-coordinator
  - crud-router
  - space-explorer
  - dictionary.roles.router
  all_rw: false
