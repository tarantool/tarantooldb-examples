  weight: 1
  all_rw: false
  vshard_group: default
storage-2:
  instances:
  - storage-2-msk
  - storage-2-spb
  roles:
  - crud-storage
  - space-explorer
  - dictionary.roles.storage
  weight: 1
  all_rw: false
