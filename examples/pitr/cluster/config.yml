credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

sharding:
  bucket_count: 30000

roles_cfg:
  roles.recovery-point-manager:
    backend: vshard-router
    create:
      by:
        interval: 30
      timeout: 30

groups:
  routers:
    replication:
      failover: manual
    sharding:
      roles: [router]
    roles:
      - roles.crud-router
      - roles.recovery-point-manager
    replicasets:
      router-1:
        leader: router-1
        instances:
          router-1:
            iproto:
              listen:
                - uri: tarantool-router-1:3301
              advertise:
                client: tarantool-router-1:3301
  storages:
    replication:
      failover: manual
    sharding:
      roles: [storage]
    roles:
      - roles.crud-storage
    replicasets:
      storage-1:
        leader: storage-1-msk
        instances:
          storage-1-msk:
            iproto:
              listen:
                - uri: tarantool-storage-1-msk:3301
              advertise:
                client: tarantool-storage-1-msk:3301
          storage-1-spb:
            iproto:
              listen:
                - uri: tarantool-storage-1-spb:3301
              advertise:
                client: tarantool-storage-1-spb:3301
          storage-1-brn:
            iproto:
              listen:
                - uri: tarantool-storage-1-brn:3301
              advertise:
                client: tarantool-storage-1-brn:3301
      storage-2:
        leader: storage-2-msk
        instances:
          storage-2-msk:
            iproto:
              listen:
                - uri: tarantool-storage-2-msk:3301
              advertise:
                client: tarantool-storage-2-msk:3301
          storage-2-spb:
            iproto:
              listen:
                - uri: tarantool-storage-2-spb:3301
              advertise:
                client: tarantool-storage-2-spb:3301
          storage-2-brn:
            iproto:
              listen:
                - uri: tarantool-storage-2-brn:3301
              advertise:
                client: tarantool-storage-2-brn:3301
