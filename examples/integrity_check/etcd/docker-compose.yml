services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --name etcd1 --advertise-client-urls http://etcd1:2379 --listen-client-urls http://0.0.0.0:2379 --initial-advertise-peer-urls http://etcd1:2380 --listen-peer-urls http://0.0.0.0:2380 --initial-cluster-token etcd-cluster --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --enable-v2
    networks:
      - tarantooldb_network
    ports:
      - "2379:2379"

  etcd2:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --name etcd2 --advertise-client-urls http://etcd2:2379 --listen-client-urls http://0.0.0.0:2379 --initial-advertise-peer-urls http://etcd2:2380 --listen-peer-urls http://0.0.0.0:2380 --initial-cluster-token etcd-cluster --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --enable-v2
    networks:
      - tarantooldb_network
    ports:
      - "2389:2379"

  etcd3:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --name etcd3 --advertise-client-urls http://etcd3:2379 --listen-client-urls http://0.0.0.0:2379 --initial-advertise-peer-urls http://etcd3:2380 --listen-peer-urls http://0.0.0.0:2380 --initial-cluster-token etcd-cluster --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --enable-v2
    networks:
      - tarantooldb_network
    ports:
      - "2399:2379"

networks:
  tarantooldb_network:
    external: true
