type: nontarantool
instrumentation:
  url: grpc-gateway-1:9081
  metrics_url: /metrics
  metrics_format: prometheus
  liveness_url: /alive
  info_url: /info
  binary: /app/tarantooldb/bin/grpc-worker
config:
  roles.httpd:
    instrumentation:
      listen: 0.0.0.0:9081
  audit_log:
    to: file
    file: /var/log/tdb-gateway/audit.jsonl
    format: json
  log:
    to: stderr
    level: info
  server:
    grpc_addr: 0.0.0.0:9090
    enable_reflection: true
  vshard:
    tarantool_cluster_prefix: /tdb/config/all
    user: client
    password: secret
    spaces:
      books:
        sharding_key: [id]
