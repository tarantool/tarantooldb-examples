credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]

iproto:
  advertise:
    peer:
      login: admin

roles_cfg:
  app.roles.tracing:
    enabled: true
    global_sample_rate: 0
    sample_rates:
      get_token_api: 2
      debug_1: 1
    base_url: 'http://tracing:9411/api/v2/spans'
    api_method: 'POST'
    report_interval: 1
    spans_limit: 1000

replication:
  failover: manual

groups:
  api:
    roles:
      - app.roles.tracing
    labels:
      tag: 'api'
    replicasets:
      api:
        leader: api-1
        instances:
          api-1:
            iproto:
              listen:
                - uri: tarantool-api-1:3301
              advertise:
                client: tarantool-api-1:3301
  workers:
    roles:
      - app.roles.tracing
    labels:
      tag: 'worker'
    replicasets:
      worker-1:
        leader: worker-1
        instances: 
          worker-1:
            iproto:
              listen:
                - uri: tarantool-worker-1:3301
              advertise:
                client: tarantool-worker-1:3301
      worker-2:
        leader: worker-2
        instances:
          worker-2:
            iproto:
              listen:
                - uri: tarantool-worker-2:3301
              advertise:
                client: tarantool-worker-2:3301
