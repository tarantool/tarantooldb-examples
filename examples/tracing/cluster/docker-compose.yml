services:
  tarantool-api-1:
    image: tarantooldb:3x-latest
    networks:
      - tarantooldb_network
    ports:
      - "3301:3301"
    environment:
      - TT_INSTANCE_NAME=api-1
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  tarantool-worker-1:
    image: tarantooldb:3x-latest
    networks:
      - tarantooldb_network
    ports:
      - "3303:3301"
    environment:
      - TT_INSTANCE_NAME=worker-1
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  tarantool-worker-2:
    image: tarantooldb:3x-latest
    networks:
      - tarantooldb_network
    ports:
      - "3304:3301"
    environment:
      - TT_INSTANCE_NAME=worker-2
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  
  init_host:
    image: tarantooldb:3x-latest
    networks:
      - tarantooldb_network
    volumes:
      - ./migrations/:/app/tarantooldb/migrations/
    depends_on:
      - tarantool-api-1
      - tarantool-worker-1
      - tarantool-worker-2
    environment:
      - TT_CLI_USERNAME=admin
      - TT_CLI_PASSWORD=secret-cluster-cookie
    command: /bin/sh -c "\
        tools/client/wait_instance_ready.sh 15 tarantool-api-1:3301 \
        && tools/client/wait_instance_ready.sh 15 tarantool-worker-1:3301 \
        && tools/client/wait_instance_ready.sh 15 tarantool-worker-2:3301 \
        && tt migrations publish http://etcd1:2379/tdb migrations \
        && tt migrations apply http://etcd1:2379/tdb \
        && echo Initialize has completed successfully."

networks:
  tarantooldb_network:
    external: true
