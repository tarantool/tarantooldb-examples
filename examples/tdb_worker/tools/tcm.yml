http:
    host: 0.0.0.0
    port: 8081

storage:
    provider: etcd
    etcd:
        prefix: /tcm
        endpoints:
            - http://etcd1:2379
            - http://etcd2:2379
            - http://etcd3:2379
security:
  bootstrap-password: secret
  signature-private-key-file: /app/tdb-worker/certs/tcm-signature.pem
  encryption-key-file: /app/tdb-worker/certs/tcm-encryption.key

cluster:
  tt-command: /app/tarantooldb/tt

feature:
  tuples: true

initial-settings:
  clusters:
    - name: Tarantool DB Cluster
      id: 00000000-0000-0000-0000-000000000001
      storage-connection:
        provider: etcd
        etcd-connection:
          prefix: /tdb
          workers-prefix: /tdb-workers/tdb
          endpoints:
            - http://etcd1:2379
            - http://etcd2:2379
            - http://etcd3:2379
      tarantool-connection:
        username: "admin"
        password: "secret-cluster-cookie"
      worker-connection:
        ssl:
          enabled: true
          # Доверенный CA для проверки серверного сертификата воркера.
          ca-file: /app/tdb-worker/certs/ca.crt
          # Собственный клиентский сертификат TCM для взаимной аутентификации (mTLS).
          cert-file: /app/tdb-worker/certs/client.crt
          key-file: /app/tdb-worker/certs/client.key

default-cluster: false
