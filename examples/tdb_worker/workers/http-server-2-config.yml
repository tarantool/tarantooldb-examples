type: nontarantool
instrumentation: # опции для мониторинга
    url:            https://worker-2:9081
    metrics_url:    /metrics
    metrics_format: "prometheus"
    liveness_url:   /alive
    info_url:       /info
    binary:         ./bin/http-server
config: # произвольная конфигурация воркера
    roles.httpd:
        instrumentation:
            listen: 0.0.0.0:9081
            ssl_cert_file: /app/tdb-worker/certs/server.crt
            ssl_key_file: /app/tdb-worker/certs/server.key
            # ssl_ca_file включает проверку клиентского сертификата (mTLS).
            ssl_ca_file: /app/tdb-worker/certs/ca.crt
    addr: 0.0.0.0:10001
    tarantool_cluster_prefix: /tdb/config/all
    tarantool_user: admin
    tarantool_pass: secret-cluster-cookie
