type: nontarantool
instrumentation: # опции для мониторинга
    url:            https://worker-1:9080
    metrics_url:    /metrics
    metrics_format: "prometheus"
    liveness_url:   /alive
    info_url:       /info
    binary:         ./bin/http-server
    ssl: # параметры HTTPS; ca_file опционален и включает mTLS
        cert_file: /app/tdb-worker/certs/server.crt
        key_file:  /app/tdb-worker/certs/server.key
        # ca_file:   /app/tdb-worker/certs/ca.crt
config: # произвольная конфигурация воркера
    addr: 0.0.0.0:10000
    tarantool_cluster_prefix: /tdb/config/all
    tarantool_user: admin
    tarantool_pass: secret-cluster-cookie
