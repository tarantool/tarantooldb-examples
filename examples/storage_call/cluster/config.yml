credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]
    storage_call_reader:
      password: 'secret'
      privileges:
        - permissions: [execute]
          lua_call: [crud.storage_call, crud.storage_call_many]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

sharding:
  bucket_count: 30000

groups:
  routers:
    replication:
      failover: manual
    sharding:
      roles: [router]
    roles:
      - roles.crud-router
    replicasets:
      router-1:
        leader: router-1
        instances:
          router-1:
            iproto:
              listen:
                - uri: tarantool-router-1:3301
              advertise:
                client: tarantool-router-1:3301
  storages:
    replication:
      failover: election
    sharding:
      roles: [storage]
    roles:
      - roles.crud-storage
    replicasets:
      storage-1:
        instances:
          storage-1-msk:
            iproto:
              listen:
                - uri: tarantool-storage-1-msk:3301
              advertise:
                client: tarantool-storage-1-msk:3301
          storage-1-spb:
            iproto:
              listen:
                - uri: tarantool-storage-1-spb:3301
              advertise:
                client: tarantool-storage-1-spb:3301
      storage-2:
        instances:
          storage-2-msk:
            iproto:
              listen:
                - uri: tarantool-storage-2-msk:3301
              advertise:
                client: tarantool-storage-2-msk:3301
          storage-2-spb:
            iproto:
              listen:
                - uri: tarantool-storage-2-spb:3301
              advertise:
                client: tarantool-storage-2-spb:3301
