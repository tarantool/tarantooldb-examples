services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command: etcd --name etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379
    networks:
      - tarantooldb_network
    ports:
      - "2379:2379"

  # Одноразовый сервис для публикации кластерной конфигурации через tt
  # (запускается только явно: docker compose run --rm tt-tools ...)
  tt-tools:
    image: tarantooldb:3.4.0
    profiles: ["tools"]
    networks:
      - tarantooldb_network
    volumes:
      - ../cluster/config.yml:/app/tarantooldb/config.yml

networks:
  tarantooldb_network:
    external: true
