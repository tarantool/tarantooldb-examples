type: nontarantool

instrumentation:
  url: https://ldap-worker-openldap:9081
  metrics_url: /metrics
  metrics_format: prometheus
  liveness_url: /alive
  info_url: /info
  binary: ./bin/ldap-worker

config:
  roles.httpd:
    instrumentation:
      listen: ldap-worker-openldap:9081
    ldap:
      listen: ldap-worker-openldap:9081
      ssl_cert_file: /certs/worker/server.pem
      ssl_key_file: /certs/worker/server-key.pem
      # CA клиентских сертификатов — включает mTLS: без клиентского
      # сертификата (роутера) соединение отклоняется
      ssl_ca_file: /certs/ca/root-ca.pem
  ldap:
    type: openldap                # пресет: template-query (uid={0}), группы — memberOf overlay
    endpoints:
      - openldap:636               # LDAPS-порт каталога
    query-user: cn=admin,dc=example,dc=com
    query-password: secret-admin
    base-dn: dc=example,dc=com
    tls:
      enabled: true                # ldaps://
      # CA примера: им проверяется сертификат каталога (certs/openldap/server.pem).
      # Имя сервера в сертификате — хост из endpoint (openldap)
      ca-file: /certs/ca/root-ca.pem
