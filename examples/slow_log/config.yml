# simple config for demo purposes

credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

config:
  etcd:
    endpoints:
      - http://etcd1:2379
      - http://etcd2:2379
      - http://etcd3:2379
    prefix: /tdb
    http:
      request:
        timeout: 3

roles_cfg:

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

replication:
  failover: manual

groups:
  routers:
    sharding:
      roles: [ router ]
    roles:
      - roles.crud-router
      - app.roles.slow_log
    app:
      module: app.vshard_bootstrapper
    replicasets:
      router-1:
        leader: router-1
        instances:
          router-1:
            iproto:
              listen:
                - uri: tarantool-router-1:3301
              advertise:
                client: tarantool-router-1:3301
  storages:
    sharding:
      roles: [ storage ]
    roles:
      - roles.crud-storage
    replicasets: 
      storage:
        leader: storage-1
        instances: 
          storage-1:
            iproto:
              listen:
                - uri: tarantool-storage-1:3301
              advertise:
                client: tarantool-storage-1:3301
          storage-2:
            iproto:
              listen:
                - uri: tarantool-storage-2:3301
              advertise:
                client: tarantool-storage-2:3301
          storage-3:
            iproto:
              listen:
                - uri: tarantool-storage-3:3301
              advertise:
                client: tarantool-storage-3:3301
          storage-4:
            iproto:
              listen:
                - uri: tarantool-storage-4:3301
              advertise:
                client: tarantool-storage-4:3301
