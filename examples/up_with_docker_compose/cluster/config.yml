credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]

iproto:
  advertise:
    peer:
      login: admin
    sharding:
      login: admin

groups:
  managers:
    roles:
      - aeon.manager
    replication:
      failover: election
    replicasets:
      manager:
        instances:
          manager-msk:
            iproto:
              listen:
                - uri: tarantool-manager-msk:3301
              advertise:
                client: tarantool-manager-msk:3301
          manager-spb:
            iproto:
              listen:
                - uri: tarantool-manager-spb:3301
              advertise:
                client: tarantool-manager-spb:3301
          manager-brn:
            iproto:
              listen:
                - uri: tarantool-manager-brn:3301
              advertise:
                client: tarantool-manager-brn:3301

  routers:
    roles:
      - aeon.router
    replication:
      failover: manual
    replicasets:
      router-msk:
        leader: router-msk
        instances:
          router-msk:
            iproto:
              listen:
                - uri: tarantool-router-msk:3301
              advertise:
                client: tarantool-router-msk:3301
      router-spb:
        leader: router-spb
        instances:
          router-spb:
            iproto:
              listen:
                - uri: tarantool-router-spb:3301
              advertise:
                client: tarantool-router-spb:3301
  storages:
    roles:
      - aeon.storage
    replication:
      failover: election
    replicasets:
      storage-1:
        instances:
          storage-1-msk:
            iproto:
              listen:
                - uri: tarantool-storage-1-msk:3301
              advertise:
                client: tarantool-storage-1-msk:3301
          storage-1-spb:
            iproto:
              listen:
                - uri: tarantool-storage-1-spb:3301
              advertise:
                client: tarantool-storage-1-spb:3301
          storage-1-brn:
            iproto:
              listen:
                - uri: tarantool-storage-1-brn:3301
              advertise:
                client: tarantool-storage-1-brn:3301
      storage-2:
        instances:
          storage-2-msk:
            iproto:
              listen:
                - uri: tarantool-storage-2-msk:3301
              advertise:
                client: tarantool-storage-2-msk:3301
          storage-2-spb:
            iproto:
              listen:
                - uri: tarantool-storage-2-spb:3301
              advertise:
                client: tarantool-storage-2-spb:3301
          storage-2-brn:
            iproto:
              listen:
                - uri: tarantool-storage-2-brn:3301
              advertise:
                client: tarantool-storage-2-brn:3301
