# simple config for demo purposes

credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [ super ]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

config:
  etcd:
    endpoints:
      - http://etcd1:2379
      - http://etcd2:2379
      - http://etcd3:2379
    prefix: /tdb
    http:
      request:
        timeout: 3

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

replication:
  failover: manual

sharding:
  bucket_count: 30000

groups:
  routers:
    sharding:
      roles: [router]
    roles:
      - roles.crud-router
#      - dictionary.roles.router
    roles_cfg:
      roles.crud-router:
        stats: true
        stats_driver: metrics
        stats_quantiles: true
        stats_quantile_tolerated_error: 0.001
        stats_quantile_age_buckets_count: 5
        stats_quantile_max_age_time: 180
    app:
      module: app.vshard_bootstrapper
    replicasets:
      router-msk:
        leader: router-msk
        instances:
          router-msk:
            iproto:
              listen:
                - uri: tarantool-router-msk:3301
              advertise:
                client: tarantool-router-msk:3301
      router-spb:
        leader: router-spb
        instances:
          router-spb:
            iproto:
              listen:
                - uri: tarantool-router-spb:3301
              advertise:
                client: tarantool-router-spb:3301
  storages:
    sharding:
      roles: [storage]
    roles:
      - roles.crud-storage
      - dictionary.roles.storage
    replicasets: 
      storage-1:
        leader: storage-1-msk
        instances: 
          storage-1-msk:
            iproto:
              listen:
                - uri: tarantool-storage-1-msk:3301
              advertise:
                client: tarantool-storage-1-msk:3301
          storage-1-spb:
            iproto:
              listen:
                - uri: tarantool-storage-1-spb:3301
              advertise:
                client: tarantool-storage-1-spb:3301
          storage-1-brn:
            iproto:
              listen:
                - uri: tarantool-storage-1-brn:3301
              advertise:
                client: tarantool-storage-1-brn:3301
      storage-2:
        leader: storage-2-msk
        instances: 
          storage-2-msk:
            iproto:
              listen:
                - uri: tarantool-storage-2-msk:3303
              advertise:
                client: tarantool-storage-2-msk:3303
          storage-2-spb:
            iproto:
              listen:
                - uri: tarantool-storage-2-spb:3304
              advertise:
                client: tarantool-storage-2-spb:3304
          storage-2-brn:
            iproto:
              listen:
                - uri: tarantool-storage-2-brn:3301
              advertise:
                client: tarantool-storage-2-brn:3301
