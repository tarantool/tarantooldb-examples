credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [super]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

replication:
  failover: election

sharding:
  bucket_count: 30000

groups:
  all_in_one:
    sharding:
      roles: [router, storage]
    roles:
      - roles.crud-router
      - roles.crud-storage
    roles_cfg:
      roles.crud-router:
        stats: true
        stats_driver: metrics
        stats_quantiles: true
        stats_quantile_tolerated_error: 0.001
        stats_quantile_age_buckets_count: 5
        stats_quantile_max_age_time: 180
    replicasets:
      router-storage-1:
        instances:
          router-storage-1:
            iproto:
              listen:
                - uri: tarantool-router-storage-1:3301
              advertise:
                client: tarantool-router-storage-1:3301
