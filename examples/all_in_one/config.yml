# simple config for demo purposes

credentials:
  users:
    admin:
      password: 'secret-cluster-cookie'
      roles: [ super ]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
    storage:
      password: 'secret'
      roles: [sharding]

config:
  etcd:
    endpoints:
      - http://etcd1:2379
      - http://etcd2:2379
      - http://etcd3:2379
    prefix: /tdb
    http:
      request:
        timeout: 3

iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage

replication:
  failover: election

sharding:
  bucket_count: 30000

groups:
  router-storage-1:
    sharding:
      roles: [router, storage]
    roles:
      - roles.crud-router
      - roles.crud-storage
    roles_cfg:
      roles.crud-router:
        stats: true
        stats_driver: metrics
        stats_quantiles: true
        stats_quantile_tolerated_error: 0.001
        stats_quantile_age_buckets_count: 5
        stats_quantile_max_age_time: 180
    app:
      module: app.vshard_bootstrapper
    replicasets:
      router-storage-1:
        instances:
          router:
            iproto:
              listen:
                - uri: tarantool-router-storage-1:3301
              advertise:
                client: tarantool-router-storage-1:3301
