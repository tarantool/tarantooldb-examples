credentials:
  users:
    admin:
      password: secret-cluster-cookie
      roles:
      - super
    client:
      password: secret
      roles:
      - super
    replicator:
      password: secret
      roles:
      - replication
    storage:
      password: secret
      roles:
      - sharding
iproto:
  advertise:
    peer:
      login: replicator
    sharding:
      login: storage
sharding:
  bucket_count: 3000
groups:
  routers:
    roles:
    - roles.crud-router
    replication:
      failover: manual
    sharding:
      roles:
      - router
    replicasets:
      router-1:
        leader: router-1
        instances:
          router-1:
            iproto:
              listen:
              - uri: router-1:3301
              advertise:
                client: router-1:3301
  storages:
    roles:
    - roles.crud-storage
    - app.roles.tdb_gateway
    replication:
      failover: manual
    sharding:
      roles:
      - storage
    replicasets:
      storage-1:
        instances:
          storage-1-a:
            iproto:
              listen:
              - uri: storage-1-a:3301
              advertise:
                client: storage-1-a:3301
          storage-1-b:
            iproto:
              listen:
              - uri: storage-1-b:3301
              advertise:
                client: storage-1-b:3301
        leader: storage-1-a
      storage-2:
        instances:
          storage-2-a:
            iproto:
              listen:
              - uri: storage-2-a:3301
              advertise:
                client: storage-2-a:3301
          storage-2-b:
            iproto:
              listen:
              - uri: storage-2-b:3301
              advertise:
                client: storage-2-b:3301
        leader: storage-2-a
