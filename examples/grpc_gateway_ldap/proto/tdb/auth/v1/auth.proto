syntax = "proto3";

package tdb.auth.v1;

option go_package = "gitlab.corp.mail.ru/tarantool/tdb/tarantooldb/workers/gen/grpc-gateway/tdb/auth/v1;authpb";

// Auth is available only when authentication is enabled. The server requires TLS
// in this mode and refuses to start without a TLS certificate and key.
service Auth {
  // Login exchanges LDAP credentials for a bearer token. Clients must verify the
  // server certificate and send credentials and tokens only over TLS.
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at_unix = 2;
}
