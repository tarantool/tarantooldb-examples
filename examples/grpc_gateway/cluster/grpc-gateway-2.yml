type: nontarantool
instrumentation:
  log:
    level: info
  url: grpc-gateway-2:9081
  metrics_url: /metrics
  metrics_format: prometheus
  liveness_url: /alive
  info_url: /info
  binary: /app/tarantooldb/bin/grpc-worker
config:
  server:
    grpc_addr: 0.0.0.0:9090
    enable_reflection: true
  vshard:
    tarantool_cluster_prefix: /tdb/config/all
    user: client
    password: secret
    spaces:
      books:
        sharding_key: [id]
