type: nontarantool
instrumentation:
  url: grpc-gateway-2:9081
  metrics_url: /metrics
  metrics_format: prometheus
  liveness_url: /alive
  info_url: /info
  binary: /app/tarantooldb/tdb-gateway/bin/tdb-grpc-gateway
config:
  server:
    grpc_addr: 0.0.0.0:9090
    enable_reflection: true
  log:
    level: info
  vshard:
    tarantool_cluster_prefix: /tdb/config/all
    user: client
    password: secret
    spaces:
      test_kv:
        sharding_key: [id]
