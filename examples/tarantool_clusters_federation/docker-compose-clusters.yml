version: '3'
services:
  tarantool-router-A:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8080:8081"
      - "3300:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-router-A:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-A
  tarantool-storage-A-1-1:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8081:8081"
      - "3301:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-A-1-1:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-A
  tarantool-storage-A-1-2:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8082:8081"
      - "3302:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-A-1-2:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-A
  tarantool-storage-A-2-1:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8083:8081"
      - "3303:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-A-2-1:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-A
  tarantool-storage-A-2-2:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "8084:8081"
      - "3304:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-A-2-2:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-A
  user-host-A:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TARANTOOLDB_TARGET_URI=tarantool-router-A:8081
      - TARANTOOLDB_BOOTSTRAP_TIMEOUT=100
    working_dir: /usr/share/tarantool/tarantooldb/client/utils/
    command: /bin/sh -c "./bootstrap.sh && ./health_check.sh && /bootstrap/setup_failover.sh && ./migrate.sh "
    depends_on:
      - tarantool-router-A
      - tarantool-storage-A-1-1
      - tarantool-storage-A-1-2
      - tarantool-storage-A-2-1
      - tarantool-storage-A-2-2
    volumes:
      - ./bootstrap-A/:/bootstrap/
  tarantool-router-B:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "9080:8081"
      - "4300:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-router-B:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-B
  tarantool-storage-B-1-1:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "9081:8081"
      - "4301:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-B-1-1:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-B
  tarantool-storage-B-1-2:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "9082:8081"
      - "4302:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-B-1-2:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-B
  tarantool-storage-B-2-1:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "9083:8081"
      - "4303:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-B-2-1:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-B
  tarantool-storage-B-2-2:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "9084:8081"
      - "4304:3301"
    environment:
      - TARANTOOL_ADVERTISE_URI=tarantool-storage-B-2-2:3301
      - TARANTOOL_CLUSTER_COOKIE=cookie-B
  user-host-B:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TARANTOOLDB_TARGET_URI=tarantool-router-B:8081
      - TARANTOOLDB_BOOTSTRAP_TIMEOUT=100
    working_dir: /usr/share/tarantool/tarantooldb/client/utils/
    command: /bin/sh -c "./bootstrap.sh && ./health_check.sh && /bootstrap/setup_failover.sh && ./migrate.sh"
    depends_on:
      - tarantool-router-B
      - tarantool-storage-B-1-1
      - tarantool-storage-B-1-2
      - tarantool-storage-B-2-1
      - tarantool-storage-B-2-2
    volumes:
      - ./bootstrap-B/:/bootstrap/
networks:
  tarantooldb_network:
