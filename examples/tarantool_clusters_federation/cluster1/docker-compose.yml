services:
  cluster1-router-msk:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    ports:
      - "3301:3301"
      - "8001:8082"
    environment:
      - TT_INSTANCE_NAME=router-msk
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-router-spb:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=router-spb
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-1-msk:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-1-msk
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-1-spb:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-1-spb
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-1-brn:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-1-brn
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-2-msk:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-2-msk
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-2-spb:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-2-spb
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3
  cluster1-storage-2-brn:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    environment:
      - TT_INSTANCE_NAME=storage-2-brn
      - TT_CONFIG_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      - TT_CONFIG_ETCD_PREFIX=/tdb1
      - TT_CONFIG_ETCD_HTTP_REQUEST_TIMEOUT=3

  init_host:
    image: tarantooldb:2x-latest
    networks:
      - tarantooldb_network
    volumes:
      - ../migrations/:/app/tarantooldb/migrations/
    depends_on:
      - cluster1-router-msk
      - cluster1-router-spb
      - cluster1-storage-1-msk
      - cluster1-storage-1-spb
      - cluster1-storage-1-brn
      - cluster1-storage-2-msk
      - cluster1-storage-2-spb
      - cluster1-storage-2-brn
    environment:
      - TT_CLI_USERNAME=admin
      - TT_CLI_PASSWORD=secret-cluster-cookie
    command: /bin/sh -c "\
        tools/client/wait_instance_ready.sh 15 cluster1-router-msk:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-router-spb:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-1-msk:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-1-spb:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-1-brn:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-2-msk:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-2-spb:3301 \
        && tools/client/wait_instance_ready.sh 15 cluster1-storage-2-brn:3301 \
        && tt replicaset vshard bootstrap cluster1-router-msk:3301 \
        && tt migrations publish http://etcd1:2379/tdb1 migrations \
        && tt migrations apply http://etcd1:2379/tdb1 \
        && echo Initialize has completed successfully."

networks:
  tarantooldb_network:
    external: true
