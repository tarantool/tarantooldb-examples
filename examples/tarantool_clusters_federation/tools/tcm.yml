http:
  host: 0.0.0.0
  port: 8081

storage:
  provider: etcd
  etcd:
    prefix: /tcm
    endpoints:
      - http://etcd1:2379
      - http://etcd2:2379
      - http://etcd3:2379

security:
  bootstrap-password: secret

cluster:
  tt-command: /app/tarantooldb/tt

feature:
  tcf: true

initial-settings:
  clusters:
    - name: Tarantool DB Cluster 1
      id: 00000000-0000-0000-0000-000000000000
      storage-connection:
        provider: etcd
        etcd-connection:
          prefix: /tdb1
          username: client
          password: secret
          endpoints:
            - http://etcd1:2379
            - http://etcd2:2379
            - http://etcd3:2379
      tarantool-connection:
        username: "admin"
        password: "secret-cluster-cookie"
    - name: Tarantool DB Cluster 2
      storage-connection:
        provider: etcd
        etcd-connection:
          prefix: /tdb2
          username: client
          password: secret
          endpoints:
            - http://etcd1:2379
            - http://etcd2:2379
            - http://etcd3:2379
      tarantool-connection:
        username: "admin"
        password: "secret-cluster-cookie"
